      code:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      deleted_by:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      logo_url:
        type: string
      max_branches:
        type: integer
      max_users:
        type: integer
      name:
        type: string
      owner_id:
        type: string
      phone:
        type: string
      tax_id:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      village_id:
        type: string
      website:
        type: string
    type: object
  lakukan-be_internal_modules_core_company_dto.CompanyUserListResponse:
