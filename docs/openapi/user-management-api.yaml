openapi: 3.0.3
info:
  title: Lakukan User Management API
  description: |
    API untuk manajemen pengguna dalam sistem Lakukan Backend.

    ## Fitur Utama
    - **User CRUD**: Create, Read, Update, Delete pengguna
    - **User List**: Daftar pengguna dengan pagination dan filter
    - **Role Management**: Assign, remove, dan sync roles untuk pengguna
    - **Password Management**: Change password untuk pengguna
    - **Soft Delete**: Restore pengguna yang telah dihapus
    - **Permission-based Access**: Setiap operasi memerlukan permission yang sesuai

    ## Permission Requirements
    Setiap endpoint memerlukan permission yang sesuai:
    - **users:read** - Untuk membaca data pengguna
    - **users:create** - Untuk membuat pengguna baru
    - **users:update** - Untuk update pengguna dan role management
    - **users:delete** - Untuk soft delete pengguna
    - **users:restore** - Untuk restore pengguna yang sudah dihapus

    ## Authentication
    Semua endpoint memerlukan JWT authentication dengan Bearer token.
    Token dapat diperoleh dari endpoint `/auth/signin`.

    ## User Status
    - **is_active**: Status aktif/non-aktif pengguna
    - **is_email_verified**: Status verifikasi email
    - **deleted_at**: Jika tidak null, pengguna sudah dihapus (soft delete)

  version: 1.0.0
  contact:
    name: Lakukan API Support
    email: support@lakukan.id
    url: https://lakukan.id
  license:
    name: Proprietary
    url: https://lakukan.id/license

servers:
  - url: http://localhost:8080/core/v1
    description: Development server
  - url: https://api.lakukan.id/core/v1
    description: Production server

tags:
  - name: Users
    description: Operasi CRUD untuk manajemen pengguna
  - name: User Roles
    description: Operasi untuk manajemen roles pengguna
  - name: User Password
    description: Operasi untuk manajemen password pengguna

security:
  - BearerAuth: []

paths:
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: |
        Mendapatkan daftar semua pengguna dengan pagination dan filter.

        **Filter yang tersedia**:
        - `search`: Search di email, username, dan full_name
        - `email`: Filter by email exact match
        - `username`: Filter by username exact match
        - `full_name`: Filter by full_name (partial match)
        - `is_active`: Filter by status aktif/non-aktif

        **Pagination**:
        - Default page: 1
        - Default page_size: 10
        - Max page_size: 100

        **Permission Required**: `users:read`
      operationId: getAllUsers
      parameters:
        - name: page
          in: query
          description: Nomor halaman (default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: page_size
          in: query
          description: Jumlah item per halaman (default 10, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
        - name: search
          in: query
          description: Search di email, username, atau full_name
          schema:
            type: string
            maxLength: 255
            example: "john"
        - name: email
          in: query
          description: Filter by email (exact match)
          schema:
            type: string
            format: email
            maxLength: 255
            example: "john@example.com"
        - name: username
          in: query
          description: Filter by username (exact match)
          schema:
            type: string
            maxLength: 50
            example: "johndoe"
        - name: full_name
          in: query
          description: Filter by full_name (partial match)
          schema:
            type: string
            maxLength: 255
            example: "John Doe"
        - name: is_active
          in: query
          description: Filter by status aktif/non-aktif
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Daftar pengguna berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserListResponse'
                  message:
                    type: string
                    example: "Users retrieved successfully"
              examples:
                success:
                  summary: Berhasil mendapatkan daftar pengguna
                  value:
                    data:
                      users:
                        - id: "850e8400-e29b-41d4-a716-446655440001"
                          email: "admin@example.com"
                          username: "admin"
                          full_name: "Administrator"
                          phone: "+62812345678"
                          is_active: true
                          is_email_verified: true
                          last_login_at: "2025-10-20T10:30:00Z"
                          roles:
                            - id: "role-1"
                              name: "Super Admin"
                              description: "Full system access"
                              is_system: true
                          created_at: "2025-01-01T00:00:00Z"
                          created_by: "System"
                          updated_at: "2025-10-20T10:30:00Z"
                          updated_by: "admin"
                        - id: "850e8400-e29b-41d4-a716-446655440002"
                          email: "user@example.com"
                          username: "johndoe"
                          full_name: "John Doe"
                          phone: null
                          is_active: true
                          is_email_verified: false
                          last_login_at: null
                          roles:
                            - id: "role-2"
                              name: "User"
                              description: "Standard user"
                              is_system: false
                          created_at: "2025-10-15T08:00:00Z"
                          created_by: "admin"
                          updated_at: "2025-10-15T08:00:00Z"
                          updated_by: null
                      total: 2
                      page: 1
                      page_size: 10
                      total_pages: 1
                    message: "Users retrieved successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Users
      summary: Create new user
      description: |
        Membuat pengguna baru.

        **Validasi**:
        - Email harus valid dan unique
        - Username harus alphanumeric, 3-50 karakter, dan unique
        - Password minimal 8 karakter, max 72 karakter
        - Full name minimal 3 karakter (opsional)
        - Phone minimal 10 karakter (opsional)
        - Role IDs harus valid UUID (opsional)

        **Permission Required**: `users:create`
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              basic:
                summary: Create user tanpa roles
                value:
                  email: "newuser@example.com"
                  username: "newuser"
                  password: "SecurePass123!"
                  full_name: "New User"
                  phone: "+62812345678"
              withRoles:
                summary: Create user dengan roles
                value:
                  email: "newuser@example.com"
                  username: "newuser"
                  password: "SecurePass123!"
                  full_name: "New User"
                  phone: "+62812345678"
                  role_ids:
                    - "role-uuid-1"
                    - "role-uuid-2"
      responses:
        '201':
          description: Pengguna berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserResponse'
                  message:
                    type: string
                    example: "User created successfully"
        '400':
          description: Request tidak valid atau validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidEmail:
                  summary: Email tidak valid
                  value:
                    message: "Invalid email format"
                    errors: ""
                invalidUsername:
                  summary: Username tidak valid
                  value:
                    message: "Username must be alphanumeric and 3-50 characters"
                    errors: ""
                passwordTooShort:
                  summary: Password terlalu pendek
                  value:
                    message: "Password must be at least 8 characters"
                    errors: ""
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email atau username sudah digunakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emailExists:
                  summary: Email sudah terdaftar
                  value:
                    message: "Email already exists"
                    errors: ""
                usernameExists:
                  summary: Username sudah digunakan
                  value:
                    message: "Username already exists"
                    errors: ""
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: |
        Mendapatkan detail pengguna berdasarkan ID.

        Response akan include:
        - Informasi user lengkap
        - Daftar roles yang dimiliki
        - Informasi created_by, updated_by, deleted_by

        **Permission Required**: `users:read`
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
            example: "850e8400-e29b-41d4-a716-446655440001"
      responses:
        '200':
          description: Detail pengguna berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserResponse'
                  message:
                    type: string
                    example: "User retrieved successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Users
      summary: Update user
      description: |
        Update data pengguna.

        **Field yang bisa diupdate**:
        - email (harus unique)
        - username (harus unique)
        - full_name
        - phone
        - is_active
        - role_ids (untuk sync roles)

        **Note**:
        - Semua field bersifat opsional
        - Hanya field yang dikirim yang akan diupdate
        - Password tidak bisa diupdate via endpoint ini (gunakan /change-password)

        **Permission Required**: `users:update`
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
            example: "850e8400-e29b-41d4-a716-446655440001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              updateEmail:
                summary: Update email saja
                value:
                  email: "newemail@example.com"
              updateMultiple:
                summary: Update beberapa field sekaligus
                value:
                  email: "newemail@example.com"
                  full_name: "Updated Name"
                  phone: "+62898765432"
                  is_active: false
              updateWithRoles:
                summary: Update user dan sync roles
                value:
                  full_name: "Updated Name"
                  role_ids:
                    - "role-uuid-1"
                    - "role-uuid-2"
      responses:
        '200':
          description: Pengguna berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserResponse'
                  message:
                    type: string
                    example: "User updated successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Email atau username sudah digunakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Users
      summary: Delete user (soft delete)
      description: |
        Soft delete pengguna.

        **Behaviour**:
        - User tidak benar-benar dihapus dari database
        - Field `deleted_at` akan diisi dengan timestamp
        - Field `deleted_by` akan diisi dengan user ID yang menghapus
        - User yang sudah dihapus tidak akan muncul di list
        - User yang sudah dihapus bisa di-restore dengan endpoint `/users/{id}/restore`

        **Permission Required**: `users:delete`
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
            example: "850e8400-e29b-41d4-a716-446655440001"
      responses:
        '200':
          description: Pengguna berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User deleted successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}/restore:
    post:
      tags:
        - Users
      summary: Restore deleted user
      description: |
        Restore pengguna yang sudah dihapus (soft delete).

        **Behaviour**:
        - Field `deleted_at` akan di-set menjadi NULL
        - Field `deleted_by` akan di-set menjadi NULL
        - User akan kembali aktif dan muncul di list

        **Permission Required**: `users:restore`
      operationId: restoreUser
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
            example: "850e8400-e29b-41d4-a716-446655440001"
      responses:
        '200':
          description: Pengguna berhasil di-restore
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserResponse'
                  message:
                    type: string
                    example: "User restored successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}/change-password:
    post:
      tags:
        - User Password
      summary: Change user password
      description: |
        Change password untuk pengguna.

        **Behaviour**:
        - User authenticated bisa change password sendiri
        - User dengan permission `users:update` bisa change password user lain (tanpa perlu old password)
        - Jika user change password sendiri, old_password wajib diisi dan divalidasi
        - Password baru minimal 8 karakter, max 72 karakter

        **Permission Required**: Authenticated user (untuk change password sendiri)
      operationId: changePassword
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
            example: "850e8400-e29b-41d4-a716-446655440001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              changeOwn:
                summary: Change password sendiri
                value:
                  old_password: "OldPassword123!"
                  new_password: "NewSecurePass456!"
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password changed successfully"
        '400':
          description: Request tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                passwordTooShort:
                  summary: Password terlalu pendek
                  value:
                    message: "Password must be at least 8 characters"
                    errors: ""
        '401':
          description: Old password salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidOldPassword:
                  summary: Old password tidak sesuai
                  value:
                    message: "Invalid old password"
                    errors: ""
        '403':
          description: Tidak memiliki akses untuk change password user lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}/roles:
    post:
      tags:
        - User Roles
      summary: Assign roles to user
      description: |
        Assign (tambahkan) roles ke pengguna.

        **Behaviour**:
        - Roles yang sudah ada tidak akan di-overwrite
        - Jika role sudah assigned, akan di-skip
        - Bisa assign multiple roles sekaligus

        **Permission Required**: `users:update`
      operationId: assignRoles
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
            example: "850e8400-e29b-41d4-a716-446655440001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRolesRequest'
            examples:
              assignSingle:
                summary: Assign satu role
                value:
                  role_ids:
                    - "role-uuid-1"
              assignMultiple:
                summary: Assign multiple roles
                value:
                  role_ids:
                    - "role-uuid-1"
                    - "role-uuid-2"
                    - "role-uuid-3"
      responses:
        '200':
          description: Roles berhasil di-assign
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserResponse'
                  message:
                    type: string
                    example: "Roles assigned successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User atau role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - User Roles
      summary: Sync user roles
      description: |
        Sync (replace) semua roles pengguna.

        **Behaviour**:
        - Semua roles yang ada akan dihapus
        - Roles baru akan di-assign sesuai dengan role_ids yang dikirim
        - Jika role_ids kosong, semua roles akan dihapus
        - Bisa digunakan untuk remove all roles dengan mengirim array kosong

        **Permission Required**: `users:update`
      operationId: syncRoles
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
            example: "850e8400-e29b-41d4-a716-446655440001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRolesRequest'
            examples:
              syncRoles:
                summary: Sync dengan roles baru
                value:
                  role_ids:
                    - "role-uuid-1"
                    - "role-uuid-2"
              removeAll:
                summary: Remove all roles
                value:
                  role_ids: []
      responses:
        '200':
          description: Roles berhasil di-sync
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserResponse'
                  message:
                    type: string
                    example: "Roles synced successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User atau role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}/roles/{roleId}:
    delete:
      tags:
        - User Roles
      summary: Remove role from user
      description: |
        Remove (hapus) satu role dari pengguna.

        **Behaviour**:
        - Hanya remove role yang spesifik
        - Role lain tetap ada
        - Jika role tidak ada/sudah di-remove, akan return success

        **Permission Required**: `users:update`
      operationId: removeRole
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (UUID)
          schema:
            type: string
            format: uuid
            example: "850e8400-e29b-41d4-a716-446655440001"
        - name: roleId
          in: path
          required: true
          description: Role ID (UUID) yang akan di-remove
          schema:
            type: string
            format: uuid
            example: "role-uuid-1"
      responses:
        '200':
          description: Role berhasil di-remove
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Role removed successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token yang didapat dari endpoint signin.

        Format: `Bearer <token>`

  schemas:
    # Request Schemas
    CreateUserRequest:
      type: object
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
          description: Email pengguna (harus unique)
          example: "newuser@example.com"
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9]+$'
          description: Username (harus unique, alphanumeric)
          example: "newuser"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Password pengguna
          example: "SecurePass123!"
        full_name:
          type: string
          minLength: 3
          maxLength: 255
          nullable: true
          description: Nama lengkap pengguna (opsional)
          example: "New User"
        phone:
          type: string
          minLength: 10
          maxLength: 20
          nullable: true
          description: Nomor telepon (opsional)
          example: "+62812345678"
        role_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Array role IDs untuk di-assign (opsional)
          example: ["role-uuid-1", "role-uuid-2"]

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
          description: Email baru (harus unique)
          example: "newemail@example.com"
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9]+$'
          nullable: true
          description: Username baru (harus unique)
          example: "newusername"
        full_name:
          type: string
          minLength: 3
          maxLength: 255
          nullable: true
          description: Nama lengkap baru
          example: "Updated Name"
        phone:
          type: string
          minLength: 10
          maxLength: 20
          nullable: true
          description: Nomor telepon baru
          example: "+62898765432"
        is_active:
          type: boolean
          nullable: true
          description: Status aktif/non-aktif
          example: true
        role_ids:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          description: Array role IDs untuk sync (opsional)
          example: ["role-uuid-1", "role-uuid-2"]

    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          format: password
          description: Password lama (wajib jika change password sendiri)
          example: "OldPassword123!"
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Password baru
          example: "NewSecurePass456!"

    AssignRolesRequest:
      type: object
      required:
        - role_ids
      properties:
        role_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: Array role IDs untuk di-assign
          example: ["role-uuid-1", "role-uuid-2"]

    SyncRolesRequest:
      type: object
      required:
        - role_ids
      properties:
        role_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Array role IDs untuk sync (bisa kosong untuk remove all)
          example: ["role-uuid-1", "role-uuid-2"]

    # Response Schemas
    RoleInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "role-uuid-1"
        name:
          type: string
          example: "Super Admin"
        description:
          type: string
          nullable: true
          example: "Full system access"
        is_system:
          type: boolean
          example: true

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "850e8400-e29b-41d4-a716-446655440001"
        email:
          type: string
          format: email
          example: "user@example.com"
        username:
          type: string
          example: "johndoe"
        full_name:
          type: string
          nullable: true
          example: "John Doe"
        phone:
          type: string
          nullable: true
          example: "+62812345678"
        is_active:
          type: boolean
          example: true
        is_email_verified:
          type: boolean
          example: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-10-20T10:30:00Z"
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleInfo'
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00Z"
        created_by:
          type: string
          nullable: true
          example: "admin"
        updated_at:
          type: string
          format: date-time
          example: "2025-10-20T10:30:00Z"
        updated_by:
          type: string
          nullable: true
          example: "admin"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        deleted_by:
          type: string
          nullable: true
          example: null

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        total:
          type: integer
          format: int64
          description: Total jumlah users
          example: 100
        page:
          type: integer
          description: Halaman saat ini
          example: 1
        page_size:
          type: integer
          description: Jumlah items per halaman
          example: 10
        total_pages:
          type: integer
          description: Total jumlah halaman
          example: 10

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Pesan error
          example: "Invalid request"
        errors:
          oneOf:
            - type: string
            - type: object
          description: Detail error (bisa string atau object)
          example: ""

  responses:
    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Invalid request payload"
            errors: "Field 'email' is required"

    Unauthorized:
      description: Tidak terautentikasi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "User not authenticated"
            errors: ""

    Forbidden:
      description: Tidak memiliki permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Permission denied: users:read required"
            errors: ""

    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "User not found"
            errors: ""

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Internal server error"
            errors: "Database connection failed"
