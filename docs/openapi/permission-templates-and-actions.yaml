openapi: 3.0.3
info:
  title: Permission Templates & Actions API
  description: |
    API documentation for Permission Templates and Permission Actions endpoints.

    ## Permission Templates
    Permission templates are predefined sets of actions that can be applied to roles.
    They simplify the process of assigning permissions by grouping common action patterns.

    Example templates:
    - **Viewer**: Read-only access (actions: ["read"])
    - **Editor**: Full CRUD access (actions: ["create", "read", "update", "delete"])
    - **Admin**: CRUD + Restore (actions: ["create", "read", "update", "delete", "restore"])
    - **Manager**: CRUD + Special actions (actions: ["create", "read", "update", "delete", "manage_users", "assign", "convert", "close"])

    ## Permission Actions
    Actions are the specific operations that can be performed on resources.
    The `/permissions/actions` endpoint provides a list of all unique actions available in the system.

  version: 1.0.0
  contact:
    name: Lakukan Backend API
    email: tantowilathif@gmail.com

servers:
  - url: http://localhost:8080/core/v1
    description: Local development server
  - url: https://api.lakukan.id/core/v1
    description: Production server

tags:
  - name: Permission Templates
    description: CRUD operations for permission templates
  - name: Permissions
    description: Permission-related endpoints including actions lookup

security:
  - BearerAuth: []

paths:
  /permissions/actions:
    get:
      tags:
        - Permissions
      summary: Get all unique actions
      description: |
        Retrieves a list of all unique action names from the permissions table.
        This endpoint is useful for:
        - Building permission template creation forms
        - Displaying available actions in dropdown/checkbox lists
        - Validating action inputs

        Actions are sorted alphabetically.

        **Common actions in the system:**
        - `assign` - Assign resources to users
        - `close` - Close deals or resources
        - `convert` - Convert resources (e.g., leads to deals)
        - `create` - Create new resources
        - `delete` - Soft delete resources
        - `export` - Export data/reports
        - `manage_users` - Manage users within resources
        - `read` - View/read resources
        - `restore` - Restore soft-deleted resources
        - `update` - Update existing resources

      operationId: getPermissionActions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Actions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Actions retrieved successfully
                  data:
                    type: array
                    items:
                      type: string
                    example:
                      - assign
                      - close
                      - convert
                      - create
                      - delete
                      - export
                      - manage_users
                      - read
                      - restore
                      - update
              examples:
                success:
                  summary: Successful response
                  value:
                    status: success
                    message: Actions retrieved successfully
                    data:
                      - assign
                      - close
                      - convert
                      - create
                      - delete
                      - export
                      - manage_users
                      - read
                      - restore
                      - update
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /permission-templates:
    get:
      tags:
        - Permission Templates
      summary: Get all permission templates
      description: |
        Retrieves a paginated list of permission templates with optional filters.

        **Query Parameters:**
        - `page`: Page number (default: 1)
        - `page_size`: Items per page (default: 10, max: 100)
        - `search`: Search by name or description
        - `include_system`: Include system templates (default: true)

      operationId: getAllPermissionTemplates
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: search
          in: query
          description: Search by name or description
          required: false
          schema:
            type: string
            maxLength: 255
        - name: include_system
          in: query
          description: Include system templates in results
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Templates retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Permission templates retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PermissionTemplate'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Permission Templates
      summary: Create a new permission template
      description: |
        Creates a new permission template with specified actions.

        **Validation Rules:**
        - Name must be unique
        - Name: 3-100 characters
        - Description: max 1000 characters (optional)
        - Actions: at least 1 action required
        - Each action: 1-50 characters

        **Note:** Use `GET /permissions/actions` to get valid action names.

      operationId: createPermissionTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionTemplateRequest'
            examples:
              viewerTemplate:
                summary: Viewer Template (Read-only)
                value:
                  name: Viewer
                  description: Read-only access to resources
                  actions:
                    - read
              editorTemplate:
                summary: Editor Template (CRUD)
                value:
                  name: Editor
                  description: Create, read, update, and delete resources
                  actions:
                    - create
                    - read
                    - update
                    - delete
              adminTemplate:
                summary: Admin Template (CRUD + Restore)
                value:
                  name: Admin
                  description: Full access including restore
                  actions:
                    - create
                    - read
                    - update
                    - delete
                    - restore
              managerTemplate:
                summary: Manager Template (CRUD + Special Actions)
                value:
                  name: Manager
                  description: Full CRUD plus manage/assign actions
                  actions:
                    - create
                    - read
                    - update
                    - delete
                    - manage_users
                    - assign
                    - convert
                    - close
      responses:
        '201':
          description: Template created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Permission template created successfully
                  data:
                    $ref: '#/components/schemas/PermissionTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Template name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Permission template name already exists
                error: ""
        '500':
          $ref: '#/components/responses/InternalServerError'

  /permission-templates/{id}:
    get:
      tags:
        - Permission Templates
      summary: Get permission template by ID
      description: Retrieves a single permission template with its actions
      operationId: getPermissionTemplateById
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Template retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Permission template retrieved successfully
                  data:
                    $ref: '#/components/schemas/PermissionTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Permission Templates
      summary: Update a permission template
      description: |
        Updates an existing permission template.

        **Restrictions:**
        - System templates (is_system: true) cannot be modified
        - Name must be unique (excluding current template)

      operationId: updatePermissionTemplate
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionTemplateRequest'
            example:
              name: Custom Editor
              description: Customized editor template with additional permissions
              actions:
                - create
                - read
                - update
                - delete
                - export
      responses:
        '200':
          description: Template updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Permission template updated successfully
                  data:
                    $ref: '#/components/schemas/PermissionTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: System templates cannot be modified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: System templates cannot be modified
                error: ""
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Template name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Permission template name already exists
                error: ""
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Permission Templates
      summary: Delete a permission template
      description: |
        Soft deletes a permission template.

        **Restrictions:**
        - System templates (is_system: true) cannot be deleted
        - Deleted templates can be restored using the restore endpoint

      operationId: deletePermissionTemplate
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Template deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Permission template deleted successfully
                  data:
                    type: object
                    nullable: true
                    example: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: System templates cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: System templates cannot be deleted
                error: ""
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /permission-templates/{id}/restore:
    post:
      tags:
        - Permission Templates
      summary: Restore a deleted permission template
      description: Restores a soft-deleted permission template
      operationId: restorePermissionTemplate
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Template restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Permission template restored successfully
                  data:
                    type: object
                    nullable: true
                    example: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from `/auth/signin` endpoint.
        Format: `Bearer <token>`

  parameters:
    TemplateId:
      name: id
      in: path
      required: true
      description: Permission Template UUID
      schema:
        type: string
        format: uuid
      example: "750e8400-e29b-41d4-a716-446655440001"

  schemas:
    PermissionTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Template UUID
          example: "750e8400-e29b-41d4-a716-446655440001"
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Template name
          example: "Editor"
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Template description
          example: "Create, read, update, and delete resources"
        is_system:
          type: boolean
          description: Whether this is a system template (immutable)
          example: true
        actions:
          type: array
          items:
            type: string
          description: List of actions included in this template
          example:
            - create
            - read
            - update
            - delete
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2025-10-19T14:30:00Z"
        created_by:
          type: string
          format: uuid
          nullable: true
          description: User ID who created the template
          example: "850e8400-e29b-41d4-a716-446655440001"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2025-10-19T14:30:00Z"
        updated_by:
          type: string
          format: uuid
          nullable: true
          description: User ID who last updated the template
          example: "850e8400-e29b-41d4-a716-446655440001"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Deletion timestamp (soft delete)
          example: null
        deleted_by:
          type: string
          format: uuid
          nullable: true
          description: User ID who deleted the template
          example: null

    CreatePermissionTemplateRequest:
      type: object
      required:
        - name
        - actions
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Unique template name
          example: "Custom Editor"
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Template description
          example: "Custom template for editors with specific permissions"
        actions:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 50
          description: List of action names (use GET /permissions/actions to get valid actions)
          example:
            - create
            - read
            - update
            - delete

    UpdatePermissionTemplateRequest:
      type: object
      required:
        - name
        - actions
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Template name (must be unique)
          example: "Custom Editor"
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Template description
          example: "Updated description"
        actions:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 50
          description: List of action names
          example:
            - create
            - read
            - update
            - delete
            - export

    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          example: 10
        total:
          type: integer
          minimum: 0
          example: 45
        total_pages:
          type: integer
          minimum: 0
          example: 5

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Error message
        error:
          type: string
          example: Detailed error information

  responses:
    BadRequest:
      description: Invalid request parameters or payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Invalid query parameters
            error: "page must be at least 1"

    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Unauthorized
            error: "Invalid or expired token"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Forbidden
            error: "You don't have permission to access this resource"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Permission template not found
            error: ""

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Failed to retrieve permission templates
            error: "database connection error"
