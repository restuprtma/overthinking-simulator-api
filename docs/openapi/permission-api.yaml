  /modules/{id}/permissions/apply-crud-template:
    post:
      tags:
        - Modules
      summary: Apply standard CRUD template
      description: |
        Auto-generate 4 standard permissions (create, read, update, delete) untuk resource tertentu dalam module.

        **Permission Required**: `permissions:create`

        **Use Case**:
        - Quick setup permissions untuk new resource
        - Standarisasi permission naming
        - Bulk create permissions

        **Behavior**:
        - Create 4 permissions: `{resource}:create`, `{resource}:read`, `{resource}:update`, `{resource}:delete`
        - Skip jika permission sudah exist (idempotent)
        - Auto-generate descriptions

        **Example**:
        Request: `{"resource": "chats"}`
        Creates:
        - `crm.chats:create` - "Create new chats"
        - `crm.chats:read` - "View chats"
        - `crm.chats:update` - "Update chats"
        - `crm.chats:delete` - "Delete chats"
      operationId: applyCRUDTemplate
      parameters:
        - name: id
          in: path
          description: Module ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
            example: "a10e8400-e29b-41d4-a716-446655440012"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCRUDTemplateRequest'
            examples:
              chatsResource:
                summary: Apply CRUD for chats resource
                value:
                  resource: "chats"
              leadsResource:
                summary: Apply CRUD for leads resource
                value:
                  resource: "leads"
      responses:
        '201':
          description: CRUD template berhasil diterapkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "CRUD template applied successfully"
                  data:
                    $ref: '#/components/schemas/CRUDTemplateResponse'
              examples:
                allCreated:
                  summary: All 4 permissions created
                  value:
                    success: true
                    message: "CRUD template applied successfully"
                    data:
                      created:
                        - id: "650e8400-e29b-41d4-a716-446655440001"
                          module_id: "a10e8400-e29b-41d4-a716-446655440012"
                          resource: "chats"
                          action: "create"
                          description: "Create new chats"
                        - id: "650e8400-e29b-41d4-a716-446655440002"
                          module_id: "a10e8400-e29b-41d4-a716-446655440012"
                          resource: "chats"
                          action: "read"
                          description: "View chats"
                        - id: "650e8400-e29b-41d4-a716-446655440003"
                          module_id: "a10e8400-e29b-41d4-a716-446655440012"
                          resource: "chats"
                          action: "update"
                          description: "Update chats"
                        - id: "650e8400-e29b-41d4-a716-446655440004"
                          module_id: "a10e8400-e29b-41d4-a716-446655440012"
                          resource: "chats"
                          action: "delete"
                          description: "Delete chats"
                      skipped: []
                      total: 4
                someSkipped:
                  summary: Some permissions already exist
                  value:
                    success: true
                    message: "CRUD template applied successfully"
                    data:
                      created:
                        - id: "650e8400-e29b-41d4-a716-446655440003"
                          module_id: "a10e8400-e29b-41d4-a716-446655440012"
                          resource: "chats"
                          action: "update"
                          description: "Update chats"
                        - id: "650e8400-e29b-41d4-a716-446655440004"
                          module_id: "a10e8400-e29b-41d4-a716-446655440012"
                          resource: "chats"
                          action: "delete"
                          description: "Delete chats"
                      skipped: ["create", "read"]
                      total: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token yang didapat dari endpoint `/auth/signin` atau `/auth/refresh`.

        Cara penggunaan:
        ```
        Authorization: Bearer <your-jwt-token>
        ```

  schemas:
    # =====================================================
    # PERMISSION SCHEMAS
    # =====================================================
    CreatePermissionRequest:
      type: object
      required:
        - module_id
        - resource
        - action
      properties:
        module_id:
          type: string
          format: uuid
          description: ID module tempat permission ini berada
          example: "a10e8400-e29b-41d4-a716-446655440001"
        resource:
          type: string
          minLength: 2
          maxLength: 100
          description: Nama resource/sumber daya yang akan diatur aksesnya
          example: "users"
        action:
          type: string
          minLength: 2
          maxLength: 50
          description: Aksi yang dapat dilakukan pada resource
          example: "create"
        description:
          type: string
          maxLength: 500
          nullable: true
          description: Deskripsi permission untuk dokumentasi
          example: "Create new users in the system"

    UpdatePermissionRequest:
      type: object
      properties:
        module_id:
          type: string
          format: uuid
          nullable: true
          description: ID module baru untuk memindahkan permission
          example: "a10e8400-e29b-41d4-a716-446655440002"
        resource:
          type: string
          minLength: 2
          maxLength: 100
          nullable: true
          description: Nama resource baru
          example: "accounts"
        action:
          type: string
          minLength: 2
          maxLength: 50
          nullable: true
          description: Aksi baru
          example: "register"
        description:
          type: string
          maxLength: 500
          nullable: true
          description: Deskripsi baru
          example: "Register new user accounts"

    PermissionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Permission ID
          example: "650e8400-e29b-41d4-a716-446655440001"
        module_id:
          type: string
          format: uuid
          description: Module ID
          example: "a10e8400-e29b-41d4-a716-446655440001"
        module:
          $ref: '#/components/schemas/ModuleResponse'
        resource:
          type: string
          description: Nama resource
          example: "users"
        action:
          type: string
          description: Nama action
          example: "create"
        description:
          type: string
          nullable: true
          description: Deskripsi permission
          example: "Create new users in the system"
        created_at:
          type: string
          format: date-time
          description: Waktu dibuat
          example: "2024-01-15T10:30:00Z"
        created_by:
          type: string
          nullable: true
          description: User yang membuat
          example: "Admin User"
        updated_at:
          type: string
          format: date-time
          description: Waktu terakhir diupdate
          example: "2024-01-15T10:30:00Z"
        updated_by:
          type: string
          nullable: true
          description: User yang mengupdate
          example: "Admin User"

    ResourceGroupedByModule:
      type: object
      properties:
        module:
          $ref: '#/components/schemas/ModuleResponse'
        resources:
          type: array
          items:
            type: string
          example: ["users", "roles", "permissions"]

    ApplyCRUDTemplateRequest:
      type: object
      required:
        - resource
      properties:
        resource:
          type: string
          minLength: 2
          maxLength: 100
          description: Nama resource untuk generate CRUD permissions
          example: "chats"

    CRUDTemplateResponse:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'
          description: List permissions yang berhasil dibuat
        skipped:
          type: array
          items:
            type: string
          description: List action yang di-skip (sudah exist)
          example: ["create", "read"]
        total:
          type: integer
          description: Total permissions yang berhasil dibuat
          example: 4

    # =====================================================
    # MODULE SCHEMAS
    # =====================================================
    CreateModuleRequest:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 50
          description: Kode unik module (lowercase, no spaces)
          example: "hr"
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Nama module yang user-friendly
          example: "Human Resources"
        description:
          type: string
          maxLength: 500
          nullable: true
          description: Deskripsi module
          example: "HR Management - Employees, Attendance, Payroll"
        icon:
          type: string
          maxLength: 50
          nullable: true
          description: Icon name (feather icons, material icons, etc)
          example: "user-check"
        color:
          type: string
          maxLength: 20
          nullable: true
          description: Color hex code untuk styling
          example: "#8B5CF6"
        sort_order:
          type: integer
          minimum: 0
          description: Urutan tampilan di UI (dalam level yang sama)
          example: 4
          default: 0
        is_active:
          type: boolean
          description: Status aktif module
          example: true
          default: true
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Parent module ID untuk hierarchical structure (null = root module)
          example: "a10e8400-e29b-41d4-a716-446655440002"
        heading:
          type: string
          maxLength: 500
          nullable: true
          description: Heading text untuk menu group (biasanya untuk root module)
          example: "Customer Relationship"
        to:
          type: string
          maxLength: 255
          nullable: true
          description: Route path untuk frontend navigation
          example: "/crm"
        url:
          type: string
          maxLength: 255
          nullable: true
          description: URL path (biasanya sama dengan 'to')
          example: "/crm"
        permission:
          type: string
          maxLength: 100
          nullable: true
          description: Permission code yang diperlukan untuk akses module ini
          example: "crm"
        tooltip:
          type: string
          maxLength: 255
          nullable: true
          description: Tooltip text untuk UI
          example: "Customer Relationship Management"
        is_menu_visible:
          type: boolean
          description: Apakah module ini visible di menu atau tidak
          example: true
          default: true

    UpdateModuleRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 50
          nullable: true
          description: Kode module baru
          example: "human-resources"
        name:
          type: string
          minLength: 2
          maxLength: 100
          nullable: true
          description: Nama baru
          example: "Human Resource Management"
        description:
          type: string
          maxLength: 500
          nullable: true
          description: Deskripsi baru
        icon:
          type: string
          maxLength: 50
          nullable: true
          description: Icon baru
          example: "briefcase"
        color:
          type: string
          maxLength: 20
          nullable: true
          description: Color baru
          example: "#F59E0B"
        sort_order:
          type: integer
          minimum: 0
          nullable: true
          description: Sort order baru
          example: 3
        is_active:
          type: boolean
          nullable: true
          description: Status aktif baru
          example: false
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Parent module ID baru (untuk move module ke parent lain)
          example: "a10e8400-e29b-41d4-a716-446655440003"
        heading:
          type: string
          maxLength: 500
          nullable: true
          description: Heading text baru
        to:
          type: string
          maxLength: 255
          nullable: true
          description: Route path baru
          example: "/human-resources"
        url:
          type: string
          maxLength: 255
          nullable: true
          description: URL path baru
          example: "/human-resources"
        permission:
          type: string
          maxLength: 100
          nullable: true
          description: Permission code baru
          example: "hr"
        tooltip:
          type: string
          maxLength: 255
          nullable: true
          description: Tooltip text baru
        is_menu_visible:
          type: boolean
          nullable: true
          description: Menu visibility baru
          example: false

    ModuleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Module ID
          example: "a10e8400-e29b-41d4-a716-446655440001"
        code:
          type: string
          description: Kode module
          example: "core"
        name:
          type: string
          description: Nama module
          example: "Core Module"
        description:
          type: string
          nullable: true
          description: Deskripsi module
          example: "Authentication, Users, Roles, Permissions"
        icon:
          type: string
          nullable: true
          description: Icon name
          example: "shield"
        color:
          type: string
          nullable: true
          description: Color hex code
          example: "#3B82F6"
        sort_order:
          type: integer
          description: Urutan tampilan
          example: 1
        is_active:
          type: boolean
          description: Status aktif
          example: true
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Parent module ID (null jika root module)
          example: null
        depth:
          type: integer
          description: Depth/level dalam tree (0 = root, 1 = level 1, dst)
          example: 0
        heading:
          type: string
          nullable: true
          description: Heading text untuk menu group
          example: "Core System"
        to:
          type: string
          nullable: true
          description: Route path untuk navigation
          example: "/core"
        url:
          type: string
          nullable: true
          description: URL path
          example: "/core"
        permission:
          type: string
          nullable: true
          description: Permission code yang diperlukan
          example: "core"
        tooltip:
          type: string
          nullable: true
          description: Tooltip text
          example: "Core System Management"
        is_menu_visible:
          type: boolean
