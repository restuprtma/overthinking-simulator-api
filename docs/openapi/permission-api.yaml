        page_size:
          type: integer
          description: Jumlah item per halaman
          example: 10
        total:
          type: integer
          format: int64
          description: Total jumlah item
          example: 100
        total_pages:
          type: integer
          description: Total jumlah halaman
          example: 10

    PaginationAllResults:
      type: object
      description: Pagination info untuk endpoint yang mengembalikan semua hasil
      properties:
        page:
          type: integer
          description: Always 1 (no pagination)
          example: 1
        page_size:
          type: integer
          description: Total jumlah item (sama dengan total)
          example: 14
        total:
          type: integer
          format: int64
          description: Total jumlah item
          example: 14
        total_pages:
          type: integer
          description: Always 1 (no pagination)
          example: 1

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          type: object
          nullable: true
          example: null

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Pesan error yang user-friendly
          example: "Invalid request payload"
        error:
          type: string
          description: Detail error (untuk debugging)
          example: "validation error: field 'resource' is required"

  responses:
    BadRequest:
      description: Request tidak valid atau parameter salah
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Token tidak valid atau sudah expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Unauthorized"
            error: "invalid or expired token"

    Forbidden:
      description: User tidak memiliki permission yang diperlukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Forbidden"
            error: "you don't have permission to access this resource"

    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
