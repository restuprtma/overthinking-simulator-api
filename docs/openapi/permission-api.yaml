openapi: 3.0.3
info:
  title: Lakukan Permission & Module Management API
  description: |
    API untuk mengelola permission (izin akses) dan modules dalam sistem Lakukan Backend.

    ## Fitur Utama
    - **CRUD Permission**: Membuat, membaca, mengupdate, dan menghapus data permission
    - **CRUD Module**: Mengelola modules untuk grouping permissions
    - **Hierarchical Module Structure**: Module dengan struktur tree unlimited depth untuk dynamic menu
    - **Module-based Grouping**: Permission dikelompokkan berdasarkan module (Core, CRM, Finance, HR, Inventory)
    - **Resource-Action Based**: Permission berbasis resource (sumber daya) dan action (aksi)
    - **Fine-grained Access Control**: Kontrol akses yang detail untuk setiap fitur
    - **Soft Delete**: Data tidak dihapus permanen
    - **Filter & Search**: Pencarian dan filter berdasarkan module, resource, action
    - **Dynamic Menu Generation**: Modules mendukung struktur tree untuk generate menu dinamis
    - **Permissions Count Badge**: Setiap module menampilkan jumlah permissions untuk UX
    - **Nested Resource Endpoints**: Manage permissions per module dengan `/modules/{id}/permissions`
    - **CRUD Template**: Auto-generate standard CRUD permissions (create, read, update, delete)

    ## Authentication
    Semua endpoint memerlukan Bearer token JWT di header Authorization:
    ```
    Authorization: Bearer <your-jwt-token>
    ```

    ## Permissions Required
    Endpoint memerlukan permission berikut:
    - `permissions:read` - Membaca data permission dan module
    - `permissions:create` - Membuat permission atau module baru
    - `permissions:update` - Mengupdate permission atau module
    - `permissions:delete` - Menghapus permission atau module (soft delete)

    ## Permission Format
    Permission dalam sistem ini mengikuti format `module:resource:action`:
    - **Module**: Kelompok fitur (contoh: core, crm, finance)
    - **Resource**: Nama sumber daya (contoh: users, roles, leads)
    - **Action**: Aksi yang dapat dilakukan (contoh: create, read, update, delete)

    ### Contoh Permission:
    - `core:users:create` - Izin untuk membuat user baru (module: core)
    - `crm:leads:read` - Izin untuk melihat data leads (module: crm)
    - `finance:invoices:update` - Izin untuk mengupdate invoice (module: finance)

  version: 3.1.0
  contact:
    name: Lakukan API Support
    email: support@lakukan.id
    url: https://lakukan.id
  license:
    name: Proprietary
    url: https://lakukan.id/license

servers:
  - url: http://localhost:8080/core/v1
    description: Development server
  - url: https://api.lakukan.id/core/v1
    description: Production server

tags:
  - name: Permissions
    description: Operasi CRUD untuk manajemen permission
  - name: Modules
    description: Operasi CRUD untuk manajemen module (grouping permissions) dengan hierarchical tree structure

security:
  - BearerAuth: []

paths:
  # =====================================================
  # PERMISSIONS ENDPOINTS
  # =====================================================
  /permissions:
    get:
      tags:
        - Permissions
      summary: Get all permissions
      description: |
        Mengambil daftar permission dengan pagination dan filter.

        **Permission Required**: `permissions:read`

        **Features**:
        - Filter by module_id untuk filter permissions per module
        - Response include module information (code, name, icon, color)
        - Ordered by module sort_order, then resource, then action
      operationId: getAllPermissions
      parameters:
        - name: page
          in: query
          description: Nomor halaman (dimulai dari 1)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: page_size
          in: query
          description: Jumlah item per halaman
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
        - name: search
          in: query
          description: Pencarian berdasarkan resource, action, atau description
          required: false
          schema:
            type: string
            maxLength: 255
            example: "users"
        - name: module_id
          in: query
          description: Filter berdasarkan module ID tertentu
          required: false
          schema:
            type: string
            format: uuid
            example: "a10e8400-e29b-41d4-a716-446655440001"
        - name: resource
          in: query
          description: Filter berdasarkan resource tertentu
          required: false
          schema:
            type: string
            maxLength: 100
            example: "users"
        - name: action
          in: query
          description: Filter berdasarkan action tertentu
          required: false
          schema:
            type: string
            maxLength: 50
            example: "read"
      responses:
        '200':
          description: Daftar permission berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Permissions retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PermissionResponse'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Permissions
      summary: Create new permission
      description: |
        Membuat permission baru dengan module_id, resource, action, dan deskripsi.

        **Permission Required**: `permissions:create`

        **Catatan**:
        - module_id harus valid dan exist di database
        - Kombinasi module_id, resource, dan action harus unik
        - Permission yang dibuat akan otomatis tersedia untuk assignment ke role
      operationId: createPermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionRequest'
      responses:
        '201':
          description: Permission berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Permission created successfully"
                  data:
                    $ref: '#/components/schemas/PermissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /permissions/resources:
    get:
      tags:
        - Permissions
      summary: Get resources grouped by module
      description: |
        Mengambil daftar semua resource yang unique, dikelompokkan berdasarkan module.

        **Permission Required**: `permissions:read`
      operationId: getResourcesGroupedByModule
      responses:
        '200':
          description: Daftar resource grouped by module berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Resources retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResourceGroupedByModule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /permissions/actions:
    get:
      tags:
        - Permissions
      summary: Get all unique actions
      description: |
        Mengambil daftar semua action yang unik dari permission yang ada.

        **Permission Required**: `permissions:read`
      operationId: getActions
      responses:
        '200':
          description: Daftar action berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Actions retrieved successfully"
                  data:
                    type: array
                    items:
                      type: string
                    example: ["create", "read", "update", "delete", "restore", "assign"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /permissions/{id}:
    get:
      tags:
        - Permissions
      summary: Get permission by ID
      description: |
        Mengambil detail permission berdasarkan ID, termasuk informasi module.

        **Permission Required**: `permissions:read`
      operationId: getPermissionById
      parameters:
        - name: id
          in: path
          description: Permission ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail permission berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Permission retrieved successfully"
                  data:
                    $ref: '#/components/schemas/PermissionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Permissions
      summary: Update permission
      description: |
        Mengupdate data permission. Semua field bersifat opsional.

        **Permission Required**: `permissions:update`
      operationId: updatePermission
      parameters:
        - name: id
          in: path
          description: Permission ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionRequest'
      responses:
        '200':
          description: Permission berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Permission updated successfully"
                  data:
                    $ref: '#/components/schemas/PermissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Permissions
      summary: Delete permission
      description: |
        Menghapus permission (soft delete). Data tidak dihapus permanen dari database.

        **Permission Required**: `permissions:delete`
      operationId: deletePermission
      parameters:
        - name: id
          in: path
          description: Permission ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Permission berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =====================================================
  # MODULES ENDPOINTS
  # =====================================================
  /modules:
    get:
      tags:
        - Modules
      summary: Get all modules
      description: |
        Mengambil **SEMUA** module tanpa pagination, diurutkan secara hierarkis berdasarkan depth, parent_id, dan sort_order.

        **Permission Required**: `permissions:read`

        **NEW Features (v3.0)**:
        - **No Pagination**: Mengembalikan semua modules sekaligus
        - **Hierarchical Ordering**: Diurutkan berdasarkan depth (level), parent_id, dan sort_order
        - **Tree Structure Support**: Modules mendukung parent-child relationship dengan unlimited depth
        - **Frontend-Ready Fields**: Termasuk heading, to, url, permission, tooltip, is_menu_visible
        - Search by code, name, or description
        - Filter by is_active status
        - Filter by parent_id (untuk get children)
        - Filter by depth (untuk get specific level)
        - Filter by is_menu_visible (untuk filter menu items)

        **Use Cases**:
        - Dynamic menu generation di frontend
        - Tree/hierarchical UI components
        - Breadcrumb navigation
        - Module hierarchy display
      operationId: getAllModules
      parameters:
        - name: search
          in: query
          description: Pencarian berdasarkan code, name, atau description
          required: false
          schema:
            type: string
            maxLength: 255
            example: "crm"
        - name: is_active
          in: query
          description: Filter berdasarkan status active
          required: false
          schema:
            type: boolean
            example: true
        - name: parent_id
          in: query
          description: Filter berdasarkan parent_id (untuk get children dari module tertentu)
          required: false
          schema:
            type: string
            format: uuid
            example: "a10e8400-e29b-41d4-a716-446655440002"
        - name: depth
          in: query
          description: Filter berdasarkan depth/level (0 = root, 1 = level 1, dst)
          required: false
          schema:
            type: integer
            minimum: 0
            example: 0
        - name: is_menu_visible
          in: query
          description: Filter berdasarkan visibility di menu
          required: false
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Daftar module berhasil diambil (SEMUA modules, no pagination)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Modules retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModuleDetailResponse'
                  pagination:
                    $ref: '#/components/schemas/PaginationAllResults'
              examples:
                hierarchicalModules:
                  summary: Hierarchical modules example
                  value:
                    success: true
                    message: "Modules retrieved successfully"
                    data:
                      - id: "a10e8400-e29b-41d4-a716-446655440002"
                        code: "crm"
                        name: "CRM"
                        description: "Customer Relationship Management - Leads, Deals, Sales Targets"
                        icon: "users"
                        color: "#10B981"
                        sort_order: 2
                        is_active: true
                        parent_id: null
                        depth: 0
                        heading: "Customer Relationship"
                        to: "/crm"
                        url: "/crm"
                        permission: "crm"
                        tooltip: "Customer Relationship Management"
                        is_menu_visible: true
                        created_at: "2024-01-15T10:30:00Z"
                        updated_at: "2024-01-15T10:30:00Z"
                      - id: "a10e8400-e29b-41d4-a716-446655440012"
                        code: "crm.chats"
                        name: "Chats"
                        description: "Multi-platform chat management (WhatsApp, Email, Phone)"
                        icon: "message-circle"
                        color: "#10B981"
                        sort_order: 1
                        is_active: true
                        parent_id: "a10e8400-e29b-41d4-a716-446655440002"
                        depth: 1
                        heading: null
                        to: "/crm/chats"
                        url: "/crm/chats"
                        permission: "crm.chats"
                        tooltip: "Chat Management"
                        is_menu_visible: true
                        permissions_count: 5
                        created_at: "2024-01-15T10:30:00Z"
                        updated_at: "2024-01-15T10:30:00Z"
                      - id: "a10e8400-e29b-41d4-a716-446655440013"
                        code: "crm.sales_persons"
                        name: "Sales Persons"
                        description: "Sales team management and assignment"
                        icon: "user-check"
                        color: "#10B981"
                        sort_order: 2
                        is_active: true
                        parent_id: "a10e8400-e29b-41d4-a716-446655440002"
                        depth: 1
                        heading: null
                        to: "/crm/sales-persons"
                        url: "/crm/sales-persons"
                        permission: "crm.sales_persons"
                        tooltip: "Sales Team Management"
                        is_menu_visible: true
                        permissions_count: 4
                        created_at: "2024-01-15T10:30:00Z"
                        updated_at: "2024-01-15T10:30:00Z"
                    pagination:
                      page: 1
                      page_size: 14
                      total: 14
                      total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Modules
      summary: Create new module
      description: |
        Membuat module baru untuk grouping permissions atau sebagai menu item.

        **Permission Required**: `permissions:create`

        **NEW Features (v3.0)**:
        - **Parent-Child Relationship**: Bisa set parent_id untuk membuat sub-module
        - **Auto Depth Calculation**: Depth otomatis dihitung berdasarkan parent
        - **Frontend Fields**: Heading, to, url, permission, tooltip, is_menu_visible

        **Catatan**:
        - Code harus unik
        - parent_id (opsional): UUID parent module untuk hierarchical structure
        - depth: Otomatis dihitung (tidak perlu diinput)
        - sort_order menentukan urutan tampilan di level yang sama
        - icon dan color digunakan untuk styling UI
      operationId: createModule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModuleRequest'
            examples:
              rootModule:
                summary: Create root module (no parent)
                value:
                  code: "hr"
                  name: "Human Resources"
                  description: "HR Management - Employees, Attendance, Payroll"
                  icon: "user-check"
                  color: "#8B5CF6"
                  sort_order: 4
                  is_active: true
                  heading: "Human Resources"
                  to: "/hr"
                  url: "/hr"
                  permission: "hr"
                  tooltip: "Human Resources Management"
                  is_menu_visible: true
              childModule:
                summary: Create child module (with parent)
                value:
                  code: "crm.leads"
                  name: "Leads"
                  description: "Lead management and tracking"
                  icon: "target"
                  color: "#10B981"
                  sort_order: 3
                  is_active: true
                  parent_id: "a10e8400-e29b-41d4-a716-446655440002"
                  to: "/crm/leads"
                  url: "/crm/leads"
                  permission: "crm.leads"
                  tooltip: "Lead Management"
                  is_menu_visible: true
      responses:
        '201':
          description: Module berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Module created successfully"
                  data:
                    $ref: '#/components/schemas/ModuleDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /modules/{id}:
    get:
      tags:
        - Modules
      summary: Get module by ID
      description: |
        Mengambil detail module berdasarkan ID, termasuk semua tree structure fields.

        **Permission Required**: `permissions:read`
      operationId: getModuleById
      parameters:
        - name: id
          in: path
          description: Module ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detail module berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Module retrieved successfully"
                  data:
                    $ref: '#/components/schemas/ModuleDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Modules
      summary: Update module
      description: |
        Mengupdate data module. Semua field bersifat opsional.

        **Permission Required**: `permissions:update`

        **NEW Features (v3.0)**:
        - Bisa mengubah parent_id untuk move module ke parent lain
        - Depth otomatis direcalculate saat parent_id berubah
        - Update tree structure fields (heading, to, url, permission, tooltip, is_menu_visible)

        **Catatan**:
        - Code baru harus unik jika diubah
        - Perubahan parent_id akan auto-recalculate depth
        - Perubahan sort_order akan mempengaruhi urutan tampilan
        - Module yang di-nonaktifkan tidak akan muncul di UI filter
      operationId: updateModule
      parameters:
        - name: id
          in: path
          description: Module ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModuleRequest'
            examples:
              moveToNewParent:
                summary: Move module to new parent
                value:
                  parent_id: "a10e8400-e29b-41d4-a716-446655440003"
              deactivateModule:
                summary: Nonaktifkan module
                value:
                  is_active: false
              updateMenuVisibility:
                summary: Hide from menu
                value:
                  is_menu_visible: false
      responses:
        '200':
          description: Module berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Module updated successfully"
                  data:
                    $ref: '#/components/schemas/ModuleDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Modules
      summary: Delete module
      description: |
        Menghapus module (soft delete).

        **Permission Required**: `permissions:delete`

        **Catatan**:
        - Soft delete: data hanya ditandai sebagai dihapus
        - Permissions yang terkait dengan module ini tidak akan terhapus
        - Module dapat di-restore kembali
      operationId: deleteModule
      parameters:
        - name: id
          in: path
          description: Module ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Module berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /modules/{id}/restore:
    post:
      tags:
        - Modules
      summary: Restore deleted module
      description: |
        Mengembalikan module yang telah dihapus (soft delete).

        **Permission Required**: `permissions:update`
      operationId: restoreModule
      parameters:
        - name: id
          in: path
          description: Module ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Module berhasil di-restore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =====================================================
  # NESTED RESOURCE: MODULE PERMISSIONS ENDPOINTS
  # =====================================================
  /modules/{id}/permissions:
    get:
      tags:
        - Modules
      summary: Get permissions by module ID
      description: |
        Mengambil semua permissions untuk module tertentu (nested resource endpoint).

        **Permission Required**: `permissions:read`

        **Use Case**:
        - Modal "Manage Permissions" di frontend
        - Inline permission management per module
        - Quick view permissions untuk specific module

        **Features**:
        - Pagination support
        - Filter by resource, action
        - Search by resource/action/description
      operationId: getPermissionsByModuleId
