# =============================================================================
# Snippet untuk DI-ADD ke nats-server.conf MAIN cluster (10.10.8.2).
# =============================================================================
# Mengaktifkan leafnode listener supaya edge nats-server di 10.10.8.1 bisa
# konek sebagai leaf. Setelah leaf up, JetStream domain "edge" reachable
# dari main via subject prefix `$JS.edge.API.>`.
#
# CARA APPLY:
#   1. Backup nats-server.conf existing di main.
#   2. Append blok di bawah (atau merge ke section yang relevan).
#   3. Reload tanpa restart kalau bisa: `nats-server --signal reload=<pid>`.
#      Atau restart pakai cara existing.
#
# Kalau main pakai NATS clustering (replicas 3), leafnode listener cukup
# di-enable di SATU node (main akan route leaf-account-import internally).
# Untuk simpel: enable di node yang paling stabil (biasanya node leader).
# =============================================================================

# Leafnode listener untuk incoming connections dari edge.
leafnodes {
  port: 7422
  # Tidak perlu TLS karena LAN private. Kalau cross-DC, WAJIB TLS.
  no_tls: true

  # Authorization untuk leaf yang masuk. Token sederhana (sama seperti
  # auth pattern existing). Edge memberikan token ini saat connect.
  authorization {
    # Generate sekali: openssl rand -hex 32
    # Simpan ke ~/.nats/secrets/leaf-token.txt dan inject lewat env saat
    # start nats-server: nats-server --auth $LEAF_TOKEN ... atau via include.
    token: $LEAF_TOKEN
  }
}

# JetStream domain — kalau main belum punya, set "hub". Domain ini wajib
# di-set di SETIDAKNYA satu sisi supaya cross-domain stream-source bekerja.
# Kalau main config existing sudah punya `jetstream { ... }` section, cukup
# tambahkan field `domain: hub` di dalamnya.
#
# Contoh full section (kalau belum ada):
# jetstream {
#   store_dir: /var/lib/nats/jetstream
#   max_memory_store: 1GB
#   max_file_store:   200GB
#   domain: hub
# }
