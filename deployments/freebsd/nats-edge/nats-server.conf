# =============================================================================
# Edge JetStream — durable spool sebelah iqplus-publisher (FreeBSD VM 10.10.8.1)
# =============================================================================
# Tujuan: menerima publish dari iqplus-publisher via 127.0.0.1 dan menyimpannya
# ke disk lokal. Main NATS cluster di 10.10.8.2 menarik (pull) dari sini via
# stream-source — sehingga partisi network atau outage di main tidak pernah
# menghentikan ingest dari IQPlus.
#
# Loaded by: ../scripts/start.sh
# Token: di-resolve dari env var $NATS_TOKEN (lihat ../README.md).
#
# Topology: docs/infra/iqplus-edge-topology.md
# =============================================================================

server_name: iqplus-edge

# Listen di semua interface — di-firewall di sisi Proxmox.
# Loopback dipakai publisher di VM yang sama.
# Port 4222 reachable dari main NATS (10.10.8.2) untuk stream-source pull.
host: 0.0.0.0
port: 4222

# HTTP monitoring — bind localhost only.
# `nats stream report` dll. tetap bisa via -s nats://10.10.8.1:4222.
http: 127.0.0.1:8222

# JetStream: file storage di disk landa, 24h retention default per stream.
jetstream {
  store_dir: /home/landa/nats-edge/data/jetstream

  # Server-level caps. Per-stream limits ditegakkan di stream config.
  # Edge VM disk free 27GB di zroot/home (ZFS mirror).
  # 28GB cap supaya 24h retention TICK+QUOTE muat (~18-19 GB steady state)
  # dengan headroom untuk burst.
  max_memory_store: 256MB
  max_file_store:   28GB

  # JetStream domain: pisahkan namespace dari main cluster ("hub").
  # Memungkinkan kedua sisi punya stream "IDX_TICK" tanpa konflik —
  # main pakai --source dengan domain qualifier kalau dibutuhkan.
  domain: edge

  # Sync setiap 2s — kompromi durability vs throughput.
  # Crash kehilangan ≤2s data; ini OK karena IQPlus akan resend EOD.
  sync_interval: 2s
}

# Token auth — sama seperti main NATS. Token di-inject lewat env $NATS_TOKEN
# saat start (lihat ../scripts/start.sh).
authorization {
  token: $NATS_TOKEN
}

# Tuning untuk burst ingest IDX (opening match, EOD resend).
max_payload:    8MB
max_pending:    256MB
max_connections: 64

# Logging
log_file:       /home/landa/nats-edge/log/nats-server.log
log_size_limit: 100MB
logtime:        true
debug:          false
trace:          false

# PID file untuk rc.d / daemon(8) supervision.
pid_file: /home/landa/nats-edge/run/nats-server.pid

# Tidak boleh write timeout merubah ack semantics — biarkan default.
write_deadline: 10s

# JetStream memungkinkan reconnect yang lebih long-lived.
ping_interval:    20s
ping_max:         3

# =============================================================================
# Leafnode connection ke main NATS hub (10.10.8.2:7422)
# =============================================================================
# Edge initiates outbound koneksi ke main. Setelah leaf up, JetStream domain
# "edge" reachable dari main lewat subject prefix `$JS.edge.API.>` — main
# stream-source pakai itu untuk pull cross-domain.
#
# Token leaf di-resolve dari env $LEAF_TOKEN (di-set di nats-edge.env).
# Token ini BEDA dengan $NATS_TOKEN di atas — yang ini untuk auth ke main,
# yang atas untuk auth client lokal (publisher).
leafnodes {
  remotes = [
    {
      # Auth: user:password embedded di URL. NATS leafnodes tidak support
      # `token` field di authorization block — pakai user/password.
      # Username "leaf" hardcoded; password = $LEAF_TOKEN dari env.
      url: "nats-leaf://leaf:$LEAF_TOKEN@10.10.8.2:7422"

      # Reconnect cepat kalau leaf putus. JetStream resume sync setelah
      # leaf reconnect — data tidak hilang, cuma tertunda.
      no_randomize: true
    }
  ]
}

