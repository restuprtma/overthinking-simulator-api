apiVersion: v1
kind: ConfigMap
metadata:
  name: lakukan-api-config
  namespace: lakukan
data:
  # Server Configuration
  SERVER_PORT: "8080"
  ENV: "production"

  # Database Pool Configuration
  DB_MAX_CONNS: "25"
  DB_MIN_CONNS: "5"
  DB_MAX_CONN_LIFETIME: "1h"
  DB_MAX_CONN_IDLE_TIME: "30m"
  DB_HEALTH_CHECK_PERIOD: "1m"
  DB_CONNECT_TIMEOUT: "5s"
  DB_SSLMODE: "require"

  # JWT Configuration
  JWT_EXPIRATION: "24h"
  JWT_REFRESH_EXPIRATION: "168h"

  # Email Configuration
  SMTP_PORT: "587"
  SMTP_FROM_EMAIL: "noreply@lakukan.com"
  SMTP_FROM_NAME: "Lakukan"

  # Security Settings
  MAX_LOGIN_ATTEMPTS: "5"
  ACCOUNT_LOCKOUT_DURATION: "30m"
  PASSWORD_RESET_EXPIRATION: "1h"
  EMAIL_VERIFICATION_REQUIRED: "true"
  EMAIL_VERIFICATION_EXPIRATION: "48h"
  MAX_PASSWORD_RESET_REQUESTS: "3"
  MAX_VERIFICATION_RESEND: "5"

---
apiVersion: v1
kind: Secret
metadata:
  name: lakukan-api-secrets
  namespace: lakukan
type: Opaque
stringData:
  # Database credentials
  DB_HOST: "your-postgres-host"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_PASSWORD: "your-secure-password"
  DB_NAME: "lakukan"

  # JWT Secret (MUST be changed in production)
  JWT_SECRET: "your-super-secret-key-change-in-production-min-32-characters"

  # SMTP Configuration
  SMTP_HOST: "smtp.gmail.com"
  SMTP_USER: "your-email@gmail.com"
  SMTP_PASSWORD: "your-app-password"

  # Frontend URLs
  FRONTEND_URL: "https://yourdomain.com"
  EMAIL_VERIFICATION_URL: "https://yourdomain.com/verify-email"
  RESET_PASSWORD_URL: "https://yourdomain.com/reset-password"

  # Support
  SUPPORT_EMAIL: "support@lakukan.com"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakukan-api
  namespace: lakukan
  labels:
    app: lakukan-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lakukan-api
  template:
    metadata:
      labels:
        app: lakukan-api
    spec:
      containers:
        - name: lakukan-api
          image: your-registry/lakukan-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: lakukan-api-config
            - secretRef:
                name: lakukan-api-secrets

          # Liveness probe - checks if container is alive
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe - checks if container is ready to serve traffic
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Startup probe - for slow starting containers
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30 # 30 * 5 = 150 seconds max startup time

          # Resource limits and requests
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: lakukan-api-service
  namespace: lakukan
  labels:
    app: lakukan-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: lakukan-api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lakukan-api-hpa
  namespace: lakukan
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lakukan-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max

---
# Optional: Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lakukan-api-ingress
  namespace: lakukan
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.yourdomain.com
      secretName: lakukan-api-tls
  rules:
    - host: api.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lakukan-api-service
                port:
                  number: 80
