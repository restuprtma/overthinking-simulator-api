apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
  namespace: tuai
  labels:
    app.kubernetes.io/name: ws-gateway
    app.kubernetes.io/component: stock-gateway
spec:
  # WebSocket fan-out is stateless per-message but holds many long-lived
  # connections. Multiple replicas are safe — each pod subscribes
  # independently to NATS subjects (idx.candle.>, idx.orderbook.>, …) and
  # owns its own client connections. HA: ingress (NGINX) should use
  # least_conn (NOT round-robin) so long-lived WS distribute evenly.
  #
  # Start at 2 for redundancy; HPA scales out under load.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ws-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ws-gateway
        app.kubernetes.io/component: stock-gateway
    spec:
      # Spread replicas across worker nodes so a single node failure
      # cannot drop all WS clients at once.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ws-gateway
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        nodetype: worker
      imagePullSecrets:
        - name: dockerhub-secret-venturoid
      containers:
        - name: ws-gateway
          image: venturoid/tuai-ws-gateway-production:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - secretRef:
                name: ws-gateway-env
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          # Per industry guidance for WS gateways:
          # ~50-80 KB per active connection × subscribed channels.
          # 512Mi headroom for ~5K connections with multi-channel subs.
          # CPU is bursty during fan-out — keep headroom for JSON encode.
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      # Long terminationGracePeriod so in-flight WS clients can finish
      # the current message before the pod goes away. Combined with
      # readiness probe + ingress draining, makes rolling deploys
      # near-transparent for clients.
      terminationGracePeriodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ws-gateway
  namespace: tuai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ws-gateway
  minReplicas: 2
  maxReplicas: 8
  # Conservative behaviour: scale up fast on sustained CPU, scale down
  # slow so transient bursts don't churn pods. WS connections survive
  # rollouts via ingress, but every pod death is a wave of reconnects.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
