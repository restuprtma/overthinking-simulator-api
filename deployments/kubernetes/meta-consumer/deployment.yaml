apiVersion: apps/v1
kind: Deployment
metadata:
  name: meta-consumer
  namespace: tuai
  labels:
    app.kubernetes.io/name: meta-consumer
    app.kubernetes.io/component: stock-consumer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: meta-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meta-consumer
        app.kubernetes.io/component: stock-consumer
    spec:
      imagePullSecrets:
        - name: dockerhub-secret-venturoid
      containers:
        - name: meta-consumer
          image: venturoid/tuai-meta-consumer-production:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: meta-consumer-env
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      terminationGracePeriodSeconds: 30
