apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuai-be-resend-order-consumer
  namespace: tuai
  labels:
    app.kubernetes.io/name: tuai-be-resend-order-consumer
    app.kubernetes.io/component: stock-consumer
spec:
  # Single replica — Type 26 backfill is bursty (one batch after market
  # close per day) and JetStream durable cursor is exclusive per consumer.
  # Bump to 2 if drain time during EOD becomes an issue.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tuai-be-resend-order-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuai-be-resend-order-consumer
        app.kubernetes.io/component: stock-consumer
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tuai-be-resend-order-consumer
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        nodetype: worker
      imagePullSecrets:
        - name: dockerhub-secret-venturoid
      containers:
        - name: tuai-be-resend-order-consumer
          image: venturoid/tuai-be-resend-order-consumer:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: tuai-be-resend-order-consumer-env
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
