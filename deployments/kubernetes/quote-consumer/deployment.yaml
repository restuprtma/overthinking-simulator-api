apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuai-be-quote-consumer
  namespace: tuai
  labels:
    app.kubernetes.io/name: tuai-be-quote-consumer
    app.kubernetes.io/component: stock-consumer
spec:
  # Stateless — Redis HSET per FID is idempotent, so JetStream durable
  # could load-balance across multiple replicas if needed. Start at 1
  # since quote throughput is comfortably handled by a single pod;
  # bump to 2 if catch-up after downtime takes too long.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tuai-be-quote-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuai-be-quote-consumer
        app.kubernetes.io/component: stock-consumer
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tuai-be-quote-consumer
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        nodetype: worker
      imagePullSecrets:
        - name: dockerhub-secret-venturoid
      containers:
        - name: tuai-be-quote-consumer
          image: venturoid/tuai-be-quote-consumer:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: tuai-be-quote-consumer-env
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
