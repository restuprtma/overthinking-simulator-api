apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuai-be-daily-ingest
  namespace: tuai
  labels:
    app.kubernetes.io/name: tuai-be-daily-ingest
    app.kubernetes.io/component: stock-batch
spec:
  # Single replica with Recreate — the daemon has an internal scheduler
  # that fires once per WIB day at DAILY_INGEST_RUN_AT. Two pods would
  # both fire (UPSERT is idempotent so result is correct, but doubles
  # work and Postgres load). Recreate guarantees no overlap during rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tuai-be-daily-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuai-be-daily-ingest
        app.kubernetes.io/component: stock-batch
    spec:
      nodeSelector:
        nodetype: worker
      imagePullSecrets:
        - name: dockerhub-secret-venturoid
      containers:
        - name: tuai-be-daily-ingest
          image: venturoid/tuai-be-daily-ingest:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: tuai-be-daily-ingest-env
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
