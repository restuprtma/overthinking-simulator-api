apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuai-be-running-order-consumer
  namespace: tuai
  labels:
    app.kubernetes.io/name: tuai-be-running-order-consumer
    app.kubernetes.io/component: stock-consumer
spec:
  # 2 replicas — Type 16 is high-frequency during market hours; durable
  # load-balances messages across subscribers (queue-group semantics).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tuai-be-running-order-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuai-be-running-order-consumer
        app.kubernetes.io/component: stock-consumer
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tuai-be-running-order-consumer
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        nodetype: worker
      imagePullSecrets:
        - name: dockerhub-secret-venturoid
      containers:
        - name: tuai-be-running-order-consumer
          image: venturoid/tuai-be-running-order-consumer:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: tuai-be-running-order-consumer-env
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1500m"
              memory: "768Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
