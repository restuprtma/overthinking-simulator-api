apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuai-be-orderbook-consumer
  namespace: tuai
  labels:
    app.kubernetes.io/name: tuai-be-orderbook-consumer
    app.kubernetes.io/component: stock-consumer
spec:
  # In-memory state: per-stock order book reconstructed from Type 16+15
  # events. Two replicas sharing one durable consumer would split events
  # across pods, leaving each with an INCOMPLETE book. Keep at 1 unless
  # a sharding scheme (e.g. one durable per stock-bucket) is wired in.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tuai-be-orderbook-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuai-be-orderbook-consumer
        app.kubernetes.io/component: stock-consumer
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tuai-be-orderbook-consumer
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        nodetype: worker
      imagePullSecrets:
        - name: dockerhub-secret-venturoid
      containers:
        - name: tuai-be-orderbook-consumer
          image: venturoid/tuai-be-orderbook-consumer:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: tuai-be-orderbook-consumer-env
          resources:
            # Order events peak ~5–10k/s; engine holds ~100k open orders
            # plus a per-stock book map. Headroom for the 100ms snapshotter
            # tick under peak load.
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 60
