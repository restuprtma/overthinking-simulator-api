apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuai-be-nbs-consumer
  namespace: tuai
  labels:
    app.kubernetes.io/name: tuai-be-nbs-consumer
    app.kubernetes.io/component: stock-consumer
spec:
  # Single replica — NBS sink does NOT have DEDUP UPSERT KEYS on its
  # QuestDB tables (see README §"Tables required"), so multi-replica
  # writes could duplicate rows on JetStream redeliver. Revisit if EOD
  # burst drain time becomes a problem; pairs with adding DEDUP first.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tuai-be-nbs-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuai-be-nbs-consumer
        app.kubernetes.io/component: stock-consumer
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tuai-be-nbs-consumer
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        nodetype: worker
      imagePullSecrets:
        - name: dockerhub-secret-venturoid
      containers:
        - name: tuai-be-nbs-consumer
          image: venturoid/tuai-be-nbs-consumer:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: tuai-be-nbs-consumer-env
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
