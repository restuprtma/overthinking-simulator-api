apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuai-be-running-trade-consumer
  namespace: tuai
  labels:
    app.kubernetes.io/name: tuai-be-running-trade-consumer
    app.kubernetes.io/component: stock-consumer
spec:
  # In-memory aggregator state (open OHLCV bars per stock per timeframe).
  # Multiple replicas would split JetStream load but each pod would only
  # see partial bars. Keep at 1 unless you implement state sharing.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tuai-be-running-trade-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuai-be-running-trade-consumer
        app.kubernetes.io/component: stock-consumer
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tuai-be-running-trade-consumer
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        nodetype: worker
      imagePullSecrets:
        - name: dockerhub-secret-venturoid
      containers:
        - name: tuai-be-running-trade-consumer
          image: venturoid/tuai-be-running-trade-consumer:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: tuai-be-running-trade-consumer-env
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 60
