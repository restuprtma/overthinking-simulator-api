apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-consumer
  namespace: tuai
  labels:
    app.kubernetes.io/name: news-consumer
    app.kubernetes.io/component: stock-consumer
spec:
  # Single replica — multi-packet assembler holds partial frames in
  # memory keyed by news_id. Splitting across replicas would cause
  # half-assembled news on each pod.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: news-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: news-consumer
        app.kubernetes.io/component: stock-consumer
    spec:
      imagePullSecrets:
        - name: dockerhub-secret-venturoid
      containers:
        - name: news-consumer
          image: venturoid/tuai-news-consumer-production:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: news-consumer-env
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      terminationGracePeriodSeconds: 30
