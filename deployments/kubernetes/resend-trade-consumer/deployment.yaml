apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuai-be-resend-trade-consumer
  namespace: tuai
  labels:
    app.kubernetes.io/name: tuai-be-resend-trade-consumer
    app.kubernetes.io/component: stock-consumer
spec:
  # 2 replicas — service is stateless; JetStream durable load-balances
  # messages across subscribers (queue-group semantics). Sized for ~5M
  # rows per batch (~4 minutes drain at 2x throughput) with redundancy.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tuai-be-resend-trade-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuai-be-resend-trade-consumer
        app.kubernetes.io/component: stock-consumer
    spec:
      # Spread pods across nodes when possible — soft constraint so we
      # don't fail to schedule if cluster is small.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tuai-be-resend-trade-consumer
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        nodetype: worker
      imagePullSecrets:
        - name: dockerhub-secret-venturoid
      containers:
        - name: tuai-be-resend-trade-consumer
          image: venturoid/tuai-be-resend-trade-consumer:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: tuai-be-resend-trade-consumer-env
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
